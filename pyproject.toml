[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sakura-tagger"
version = "0.1.0"
description = "Single-backbone Kaloscope multi-task tagging"
requires-python = ">=3.11"
dependencies = ["torch>=2.5", "safetensors>=0.4", "numpy>=1.26", "Pillow>=10", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
