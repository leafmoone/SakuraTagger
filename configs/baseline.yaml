# Formal single-artist architecture baseline; no automatic training.
# Candidate sizes only. The versioned dataset vocabulary is authoritative.
head_layout:
  version: sakura-tagger-heads-v1
  general: 37679
  character: 50369
  copyright: 17664
  other_artist: 21506
  feature_dim: 512
  identity_feature_mode: global
  attention_dim: 256
  attention_heads: 4
  query_count: 16
stage: frozen_heads
loss:
  gamma_pos: 0
  gamma_neg: 4
  clip: 0.05
  chunk_size: 4096
  other_artist_mode: single_label
  weights: {general: 1.0, character: 1.0, copyright: 1.0, other_artist: 1.0}
rfs: {threshold: 0.001, max_repeat_factor: 3.0}
preservation: {global_features: 0.0, style_embedding: 0.0, artist_logits: 0.0}
identity_metric_weight: 0.0
trainer:
  learning_rate: 0.0001
  weight_decay: 0.01
  accumulation_steps: 1
  amp: 'off'
  gradient_clip: 1.0

# Engineering examples only: lambda/K have not been tuned on real data.
sparse_loss:
  other_artist_mode: single_label
  weak_negative_scope: domain
  source_filter: []
  seed: 0
  weights: {general: 1.0, character: 1.0, copyright: 1.0, other_artist: 1.0}
  domains:
    general: {mode: sampled_weak_negative, lambda_u: 1.0, lambda_n: 1.0, sample_size: 2048, chunk_size: 4096}
    character: {mode: sampled_weak_negative, lambda_u: 1.0, lambda_n: 1.0, sample_size: 2048, chunk_size: 4096}
    copyright: {mode: sampled_weak_negative, lambda_u: 1.0, lambda_n: 1.0, sample_size: 2048, chunk_size: 4096}

# Example only; size/time budgets are configurable for the chosen machine.
cache:
  root: cache/shards
  job_id: reference_run
  capacity_bytes: 10737418240  # 10 GiB, not a required machine size
  high_watermark: 0.9
  low_watermark: 0.7
  prefetch_count: 2
  workers: 2
  wait_timeout: 120.0
  transfer_timeout: 3600.0
  read_timeout: 30.0
  retries: 1
  max_member_bytes: 134217728

sampling:
  assets: cache/sampling
  batch_size: 8
  window_samples: 4096
  seed: 0
  num_workers: 0
  worker_transport: shared_memory  # numpy uses ordinary pipes if tensor-FD IPC is unavailable
  worker_timeout: 60.0

# Formal explicit-window trainer. Null limits deliberately prevent run().
window_trainer:
  stage: T1
  learning_rates: {backbone_last4: 0.00001, general: 0.0001, identity: 0.0001, other_artist: 0.0001}
  weight_decay: 0.01
  accumulation_steps: 4
  amp: 'off'
  gradient_clip: 1.0
  warmup_updates: 100
  schedule_updates: 10000
  minimum_lr_ratio: 0.0
  max_optimizer_steps: null
  max_epochs: null
  max_attempted_windows: null
  preservation: {global_features: 0.0, style_embedding: 0.0, artist_logits: 0.0}

# Shared CLI paths; pass flags or replace null with ${ENVIRONMENT_VARIABLE}.
# Relative runtime/cache paths resolve from the command's working directory.
runtime:
  release: null
  index: null
  model_dir: null
  checkpoint: null
  initialize_from: null
  calibration: null
  package: null
  run_dir: null
  device: cpu
  distributed_timeout_seconds: 600  # Includes bounded checkpoint/evaluation waits.
preprocessing:
  bucket: {target_pixels: 262144, max_pixels: 278528, max_side: 2048, alignment: 16, preferred_error: 0.01, max_error: 0.02}
  alpha_background: [255, 255, 255]
run:
  checkpoint_every_updates: null
  evaluate_every_updates: null
